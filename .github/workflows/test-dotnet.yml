name: Test .NET

on:
  push:
    branches:
      - v2-speedygonzales
    paths-ignore:
      - '*.md'
      - 'Docs/**'
      - 'Examples/**'
      - '.gitignore'
  pull_request:
    branches:
      - v2-speedygonzales
      - feature/wallpaper-scenarios

env:
  DOTNET_VERSION: '8.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  test-portable:
    name: 'Portable (${{ matrix.os }})'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: EvotecIT/.github/actions/setup-dotnet@6951a19318dbacbae020a2c1e0d4ffa300a95c6d
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Test portable engine and real system facts
        run: dotnet test Sources/PowerBGInfo.Tests/PowerBGInfo.Tests.csproj -c Release -f net8.0
      - name: Test portable engine on .NET 10
        run: dotnet test Sources/PowerBGInfo.Tests/PowerBGInfo.Tests.csproj -c Release -f net10.0
      - name: Build portable PowerShell entry point
        run: dotnet build Sources/PowerBGInfo.PowerShell/PowerBGInfo.PowerShell.csproj -c Release -f net8.0
      - name: Render through PowerShell and the CLI
        shell: pwsh
        run: |
          Import-Module ./Sources/PowerBGInfo.PowerShell/bin/Release/net8.0/PowerBGInfo.PowerShell.dll -Force
          $facts = Get-BGInfoSystemInfo
          if ([string]::IsNullOrWhiteSpace($facts.ComputerName) -or $facts.Disks.Count -eq 0) {
              throw 'Expected real portable system facts.'
          }
          Get-BGInfoCapability | Format-List
          $output = Join-Path $PWD 'Artefacts/PortableSmoke'
          $configuration = New-BGInfo -Target File -PassThru -ConfigurationDirectory $output -OutputFileName 'portable.png' {
              New-BGInfoBackground -Width 640 -Height 360
              New-BGInfoValue -Name Host -Value $facts.ComputerName
              New-BGInfoValue -Name OS -Value $facts.OSName
          }
          $json = Join-Path $output 'portable.json'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Export-BGInfoConfiguration -InputObject $configuration -Path $json -Force
          & dotnet ./Sources/PowerBGInfo.Cli/bin/Release/net8.0/PowerBGInfo.Cli.dll --config $json --no-apply
          if ($LASTEXITCODE -ne 0) { throw 'Portable CLI render failed.' }
          $image = [ChartForgeX.Raster.RasterImageDecoder]::Read((Join-Path $output 'portable.png'))
          if ($image.Width -ne 640 -or $image.Height -ne 360) { throw 'Unexpected image dimensions.' }

  test-windows:
    name: 'Windows'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: EvotecIT/.github/actions/setup-dotnet@6951a19318dbacbae020a2c1e0d4ffa300a95c6d
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Sources/PowerBGInfo.sln

      - name: Build solution
        run: dotnet build Sources/PowerBGInfo.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests
        run: dotnet test Sources/PowerBGInfo.Tests/PowerBGInfo.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net8.0-windows --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"

      - name: Export config from PowerShell
        shell: pwsh
        run: |
          Import-Module .\Sources\PowerBGInfo.PowerShell\bin\${{ env.BUILD_CONFIGURATION }}\net8.0-windows\PowerBGInfo.PowerShell.dll -Force
          $sampleImage = (Resolve-Path .\Examples\Samples\TapC-Evotec-2560x1080.jpg).Path
          $configPath = Join-Path $PWD 'interop.bginfo.json'
          $outputDir = Join-Path $PWD 'interop-output'
          $config = New-BGInfoConfiguration -Target File
          $config.FilePath = $sampleImage
          $config.ConfigurationDirectory = $outputDir
          $config.OutputFileName = 'interop.png'
          $config.Entries.Add((New-BGInfoValue -BuiltinValue HostName))
          $osEntry = New-BGInfoValue -BuiltinValue OSName
          if ($osEntry.BuiltinValue -ne 'OSName' -or -not [string]::IsNullOrWhiteSpace($osEntry.Value)) {
              throw 'Expected an unresolved OSName token for portable configuration.'
          }
          $resolvedOsName = [PowerBGInfo.SystemInfoProvider]::GetValue($osEntry.BuiltinValue)
          if ([string]::IsNullOrWhiteSpace($resolvedOsName)) {
              throw 'Expected the PowerShell host to resolve the WMI-backed OSName value.'
          }
          $config.Entries.Add($osEntry)
          Export-BGInfoConfiguration -InputObject $config -Path $configPath -Force
          if (-not (Test-Path -LiteralPath $configPath)) {
              throw "Expected exported config at $configPath"
          }

      - name: Publish CLI single-file
        run: dotnet publish Sources/PowerBGInfo.Cli/PowerBGInfo.Cli.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net8.0-windows --runtime win-x64 --self-contained false -p:PublishSingleFile=true -o artifacts/cli-singlefile

      - name: Run published CLI with PowerShell-generated config
        shell: pwsh
        run: |
          $configPath = Join-Path $PWD 'interop.bginfo.json'
          $outputPath = Join-Path $PWD 'interop-output\interop.png'
          & .\artifacts\cli-singlefile\PowerBGInfo.Cli.exe --config $configPath --no-apply
          if (-not (Test-Path -LiteralPath $outputPath)) {
              throw "Expected generated output at $outputPath"
          }

      - name: Run published CLI with PowerShell script
        shell: pwsh
        run: |
          $sampleImage = (Resolve-Path .\Examples\Samples\TapC-Evotec-2560x1080.jpg).Path
          $scriptPath = Join-Path $PWD 'interop.bginfo.ps1'
          $scriptOutputDir = Join-Path $PWD 'interop-script-output'
          $scriptJsonPath = Join-Path $PWD 'interop-script.bginfo.json'
          $modulePath = Join-Path $PWD 'Sources\PowerBGInfo.PowerShell\bin\${{ env.BUILD_CONFIGURATION }}\net8.0-windows\PowerBGInfo.PowerShell.dll'
          @"
          New-BGInfo {
              New-BGInfoValue -BuiltinValue HostName
          } -FilePath '$($sampleImage.Replace("'", "''"))' -ConfigurationDirectory '$($scriptOutputDir.Replace("'", "''"))' -Target File -OutputFileName 'interop-script.png' -PassThru
          "@ | Set-Content -LiteralPath $scriptPath -Encoding UTF8

          & .\artifacts\cli-singlefile\PowerBGInfo.Cli.exe --script $scriptPath --module $modulePath --export-json $scriptJsonPath --no-apply

          $outputPath = Join-Path $scriptOutputDir 'interop-script.png'
          if (-not (Test-Path -LiteralPath $outputPath)) {
              throw "Expected generated output at $outputPath"
          }
          if (-not (Test-Path -LiteralPath $scriptJsonPath)) {
              throw "Expected generated JSON at $scriptJsonPath"
          }

      - name: Publish CLI NativeAOT smoke build
        run: dotnet publish Sources/PowerBGInfo.Cli/PowerBGInfo.Cli.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net8.0 --runtime win-x64 -p:PublishProfile=NativeAot -o artifacts/cli-aot

      - name: Run NativeAOT CLI with PowerShell-generated config
        shell: pwsh
        run: |
          $configPath = Join-Path $PWD 'interop.bginfo.json'
          $outputPath = Join-Path $PWD 'interop-output\interop-aot.png'
          $json = Get-Content -LiteralPath $configPath -Raw
          $json = $json -replace 'interop\.png', 'interop-aot.png'
          Set-Content -LiteralPath $configPath -Value $json -Encoding UTF8
          & .\artifacts\cli-aot\PowerBGInfo.Cli.exe --config $configPath --no-apply
          if (-not (Test-Path -LiteralPath $outputPath)) {
              throw "Expected generated output at $outputPath"
          }

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-windows
          path: '**/*.trx'

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports-windows
          path: '**/coverage.cobertura.xml'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: '**/coverage.cobertura.xml'
