name: Test PowerShell

on:
  push:
    branches:
      - v2-speedygonzales
    paths-ignore:
      - '*.md'
      - 'Docs/**'
      - 'Examples/**'
      - '.gitignore'
  pull_request:
    branches:
      - v2-speedygonzales
      - feature/wallpaper-scenarios

env:
  DOTNET_VERSION: '8.x'
  BUILD_CONFIGURATION: 'Debug'

jobs:
  refresh-psd1:
    name: 'Refresh PSD1'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          } else {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          Install-Module PSPublishModule -MinimumVersion 3.0.170 -Force -Scope CurrentUser -AllowClobber

      - name: Build unsigned module and refresh manifest
        shell: pwsh
        run: |
          ./Build/Build-Module.ps1 -ConfigurationGateMode Build -SignModule:$false -SkipInstall

      - name: Upload refreshed manifest
        uses: actions/upload-artifact@v7
        with:
          name: psd1
          path: PowerBGInfo.psd1

  test-windows-ps5:
    needs: refresh-psd1
    name: 'Windows PowerShell 5.1'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download manifest
        uses: actions/download-artifact@v8
        with:
          name: psd1
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            ${{ env.DOTNET_VERSION }}

      - name: Install PowerShell modules
        shell: powershell
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          } else {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

      - name: Build .NET solution
        run: |
          dotnet restore Sources/PowerBGInfo.sln
          dotnet build Sources/PowerBGInfo.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run PowerShell tests
        shell: powershell
        run: ./PowerBGInfo.Tests.ps1

  test-windows-ps7:
    needs: refresh-psd1
    name: 'Windows PowerShell 7'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download manifest
        uses: actions/download-artifact@v8
        with:
          name: psd1
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            ${{ env.DOTNET_VERSION }}

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          } else {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

      - name: Build .NET solution
        run: |
          dotnet restore Sources/PowerBGInfo.sln
          dotnet build Sources/PowerBGInfo.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run PowerShell tests
        shell: pwsh
        run: ./PowerBGInfo.Tests.ps1

  test-windows-packaged-alc:
    needs: refresh-psd1
    name: 'Windows Packaged ALC'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download manifest
        uses: actions/download-artifact@v8
        with:
          name: psd1
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            ${{ env.DOTNET_VERSION }}

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          } else {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          Install-Module -Name PSPublishModule -Repository PSGallery -MinimumVersion 3.0.170 -Force -Scope CurrentUser -AllowClobber
          Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

      - name: Build packaged module
        shell: pwsh
        run: ./Build/Build-Module.ps1 -ConfigurationGateMode Build -SignModule:$false -SkipInstall
        timeout-minutes: 15

      - name: Run packaged ALC smoke test
        shell: pwsh
        env:
          PowerBGInfoPackagedAlcRequired: 'true'
        run: |
          Import-Module Pester -Force
          $config = [PesterConfiguration]::Default
          $config.Run.Path = 'Tests/AssemblyLoadContext.Conflict.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
        timeout-minutes: 5

      - name: Verify packaged Windows PowerShell 5.1 import, WMI and rendering
        shell: powershell
        run: |
          $manifest = Get-ChildItem ./Artefacts/Unpacked/Modules/PowerBGInfo -Filter PowerBGInfo.psd1 -Recurse |
              Select-Object -First 1
          if ($null -eq $manifest) { throw 'Packaged module manifest was not produced.' }
          Import-Module $manifest.FullName -Force -ErrorAction Stop
          $facts = Get-BGInfoSystemInfo
          if ([string]::IsNullOrWhiteSpace($facts.OSName) -or $facts.OSName -eq 'Unknown') {
              throw 'Expected a WMI-backed Windows OS name in PowerShell 5.1.'
          }
          $output = Join-Path $env:RUNNER_TEMP 'PowerBGInfo-WinPS51'
          $path = New-BGInfo -Target File -ConfigurationDirectory $output -OutputFileName 'windows51.png' {
              New-BGInfoBackground -Width 640 -Height 360
              New-BGInfoValue -Name Host -Value $facts.ComputerName
              New-BGInfoValue -Name Windows -Value $facts.OSName
          }
          $image = [ChartForgeX.Raster.RasterImageDecoder]::Read($path)
          if ($image.Width -ne 640 -or $image.Height -ne 360) { throw 'Unexpected Windows PowerShell image dimensions.' }
        timeout-minutes: 5

      - name: Verify packaged portable Core retains Windows WMI facts
        shell: pwsh
        run: |
          $manifest = Get-ChildItem ./Artefacts/Unpacked/Modules/PowerBGInfo -Filter PowerBGInfo.psd1 -Recurse |
              Select-Object -First 1
          Import-Module $manifest.FullName -Force -ErrorAction Stop
          $facts = Get-BGInfoSystemInfo
          if ([string]::IsNullOrWhiteSpace($facts.OSName) -or $facts.OSName -eq 'Unknown') {
              throw 'Expected Windows WMI facts from the portable Core payload.'
          }
        timeout-minutes: 5
