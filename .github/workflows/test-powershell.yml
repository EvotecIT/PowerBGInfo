name: Test PowerShell

on:
  push:
    branches:
      - v2-speedygonzales
    paths-ignore:
      - '*.md'
      - 'Docs/**'
      - 'Examples/**'
      - '.gitignore'
  pull_request:
    branches:
      - v2-speedygonzales

env:
  DOTNET_VERSION: '8.x'
  BUILD_CONFIGURATION: 'Debug'
  ChartForgeXProjectPath: '${{ github.workspace }}\external\ChartForgeX\ChartForgeX\ChartForgeX.csproj'

jobs:
  refresh-psd1:
    name: 'Refresh PSD1'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout ChartForgeX dependency
        uses: actions/checkout@v4
        with:
          repository: EvotecIT/ChartForgeX
          ref: main
          path: external/ChartForgeX

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Name PSGallery -SourceLocation 'https://www.powershellgallery.com/api/v2' -PublishLocation 'https://www.powershellgallery.com/api/v2/package/' -ScriptSourceLocation 'https://www.powershellgallery.com/api/v2/items/psscript' -ScriptPublishLocation 'https://www.powershellgallery.com/api/v2/package/' -InstallationPolicy Trusted
          } else {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          Install-Module PSPublishModule -MinimumVersion 3.0.4 -Force -Scope CurrentUser -AllowClobber

      - name: Refresh module manifest
        shell: pwsh
        env:
          RefreshPSD1Only: 'true'
        run: |
          ./Build/Build-Module.ps1

      - name: Upload refreshed manifest
        uses: actions/upload-artifact@v4
        with:
          name: psd1
          path: PowerBGInfo.psd1

  test-windows-ps5:
    needs: refresh-psd1
    name: 'Windows PowerShell 5.1'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout ChartForgeX dependency
        uses: actions/checkout@v4
        with:
          repository: EvotecIT/ChartForgeX
          ref: main
          path: external/ChartForgeX

      - name: Download manifest
        uses: actions/download-artifact@v4
        with:
          name: psd1
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            ${{ env.DOTNET_VERSION }}

      - name: Install PowerShell modules
        shell: powershell
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Name PSGallery -SourceLocation 'https://www.powershellgallery.com/api/v2' -PublishLocation 'https://www.powershellgallery.com/api/v2/package/' -ScriptSourceLocation 'https://www.powershellgallery.com/api/v2/items/psscript' -ScriptPublishLocation 'https://www.powershellgallery.com/api/v2/package/' -InstallationPolicy Trusted
          } else {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

      - name: Build .NET solution
        run: |
          dotnet restore Sources/PowerBGInfo.sln -p:ChartForgeXProjectPath="$env:ChartForgeXProjectPath"
          dotnet build Sources/PowerBGInfo.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore -p:ChartForgeXProjectPath="$env:ChartForgeXProjectPath"

      - name: Run PowerShell tests
        shell: powershell
        run: ./PowerBGInfo.Tests.ps1

  test-windows-ps7:
    needs: refresh-psd1
    name: 'Windows PowerShell 7'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout ChartForgeX dependency
        uses: actions/checkout@v4
        with:
          repository: EvotecIT/ChartForgeX
          ref: main
          path: external/ChartForgeX

      - name: Download manifest
        uses: actions/download-artifact@v4
        with:
          name: psd1
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            ${{ env.DOTNET_VERSION }}

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Name PSGallery -SourceLocation 'https://www.powershellgallery.com/api/v2' -PublishLocation 'https://www.powershellgallery.com/api/v2/package/' -ScriptSourceLocation 'https://www.powershellgallery.com/api/v2/items/psscript' -ScriptPublishLocation 'https://www.powershellgallery.com/api/v2/package/' -InstallationPolicy Trusted
          } else {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

      - name: Build .NET solution
        run: |
          dotnet restore Sources/PowerBGInfo.sln -p:ChartForgeXProjectPath="$env:ChartForgeXProjectPath"
          dotnet build Sources/PowerBGInfo.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore -p:ChartForgeXProjectPath="$env:ChartForgeXProjectPath"

      - name: Run PowerShell tests
        shell: pwsh
        run: ./PowerBGInfo.Tests.ps1

  test-windows-packaged-alc:
    needs: refresh-psd1
    name: 'Windows Packaged ALC'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout ChartForgeX dependency
        uses: actions/checkout@v4
        with:
          repository: EvotecIT/ChartForgeX
          ref: main
          path: external/ChartForgeX

      - name: Download manifest
        uses: actions/download-artifact@v4
        with:
          name: psd1
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            ${{ env.DOTNET_VERSION }}

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Name PSGallery -SourceLocation 'https://www.powershellgallery.com/api/v2' -PublishLocation 'https://www.powershellgallery.com/api/v2/package/' -ScriptSourceLocation 'https://www.powershellgallery.com/api/v2/items/psscript' -ScriptPublishLocation 'https://www.powershellgallery.com/api/v2/package/' -InstallationPolicy Trusted
          } else {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          Install-Module -Name PSPublishModule -Repository PSGallery -MinimumVersion 3.0.4 -Force -Scope CurrentUser -AllowClobber
          Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

      - name: Build packaged module
        shell: pwsh
        env:
          RefreshPSD1Only: 'false'
          SignModule: 'false'
        run: ./Build/Build-Module.ps1
        timeout-minutes: 15

      - name: Run packaged ALC smoke test
        shell: pwsh
        env:
          PowerBGInfoPackagedAlcRequired: 'true'
        run: |
          Import-Module Pester -Force
          $config = [PesterConfiguration]::Default
          $config.Run.Path = 'Tests/AssemblyLoadContext.Conflict.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
        timeout-minutes: 5
